  pageInfo: PageInfo!
}

enum BudgetSeriesBasis {
  YTD
  PERIOD_DIFFERENCE
  FULL_YEAR
}

"Availability of an audited execution grid point; unavailable periods have no DataPoint."
enum BudgetSeriesPeriodStatus {
  AVAILABLE
  UNAVAILABLE
  OUT_OF_COVERAGE
}

enum BudgetSeriesValueBasis {
  REPORTED_CUMULATIVE
  REPORTED_CUMULATIVE_FIRST_PERIOD
  DERIVED_DIFFERENCE_BETWEEN_REPORTS
}

type BudgetSeriesOperand {
  month: String!
  selectionId: ID
  releaseId: ID
  observationKey: String
  sourceState: String
  document: BudgetSourceDocument
  coverage: BudgetDateInterval
  executionStatus: BudgetExecutionStatus
  finality: BudgetExecutionFinality
  label: BudgetCellEvidence
  headers: [BudgetCellEvidence!]!
}

type BudgetSeriesPeriod {
  "Requested YYYY-MM, YYYY-QN or YYYY label; values occur only in DataSeries.data."
  date: String!
  periodStart: Date!
  periodEnd: Date!
  status: BudgetSeriesPeriodStatus!
  "Null when AVAILABLE; otherwise the exact lowercase view or coverage code, open vocabulary."
  reason: String
  valueBasis: BudgetSeriesValueBasis
  endpoint: BudgetSeriesOperand
  predecessor: BudgetSeriesOperand
}

type BudgetNationalSeries {
  item: BudgetExecutionItem!
  component: String!
  basis: BudgetSeriesBasis!
  unit: BudgetValueUnit!
  series: DataSeries!
  periods: [BudgetSeriesPeriod!]!
}

type BudgetNationalSeriesResult {
  snapshot: String!
  mappingVersion: String!
  derivationVersion: String!
  coverage: BudgetExecutionCoverage!
  results: [BudgetNationalSeries!]!
}

type BudgetExecutionCatalog {
  coverage: BudgetExecutionCoverage!
  seriesItems: [BudgetExecutionItem!]!
}

type BudgetNationalSnapshots {
  approved: String!
  execution: String!
}

type BudgetNationalCatalog {
  snapshots: BudgetNationalSnapshots!
  approved: BudgetApprovedCatalog!
  execution: BudgetExecutionCatalog!
}

input BudgetApprovedSeriesAxisInput @oneOf {
  targetYearsOfEdition: ID
  editionsForTarget: BudgetEditionsForTargetInput
  ownYearApprovals: BudgetOwnYearApprovalsInput
}

input BudgetEditionsForTargetInput {
  targetYear: Int!
  editionIds: [ID!]
}

input BudgetOwnYearApprovalsInput {
  editionIds: [ID!]
}

input BudgetApprovedSeriesInput {
  axis: BudgetApprovedSeriesAxisInput!
  fund: BudgetFund!
  total: BudgetApprovedTotalKey!
  creditType: BudgetCreditType
  authorityCode: String
  period: ReportPeriodInput!
  unit: BudgetApprovedUnit = THOUSAND_LEI
}

input BudgetApprovedRecordSource @oneOf {
  edition: BudgetApprovedEditionFormInput
  interpretationId: ID
}

input BudgetApprovedEditionFormInput {
  editionId: ID!
  form: BudgetApprovedForm!
}

input BudgetApprovedRecordsInput {
  source: BudgetApprovedRecordSource!
  authorityCode: String
  rowRoles: [BudgetApprovedRowRole!]
  creditTypes: [BudgetCreditType!]
  capitols: [String!]
}

input BudgetExecutionReleasesInput {
  months: ReportPeriodInput!
  revisionsPerMonth: Int = 1
}

input BudgetExecutionObservationSource @oneOf {
  months: ReportPeriodInput
  selectionIds: [ID!]
}

input BudgetExecutionObservationsInput {
  source: BudgetExecutionObservationSource!
  inputs: [BudgetExecutionInput!]
  components: [String!]
  sections: [BudgetExecutionSection!]
  lineItems: [String!]
  itemIds: [ID!]
  measures: [BudgetExecutionMeasure!]
  periodRoles: [BudgetExecutionPeriodRole!]
  dispositions: [BudgetObservationDisposition!]
}

input BudgetNationalExecutionSeriesInput {
  itemIds: [ID!]!
  period: ReportPeriodInput!
  basis: BudgetSeriesBasis!
}

extend type Query {
  budgetNationalCatalog: BudgetNationalCatalog!
  budgetApprovedTotals(input: BudgetApprovedTotalsInput!, expectedSnapshot: String): BudgetApprovedTotalsResult!
  budgetApprovedSeries(input: BudgetApprovedSeriesInput!, expectedSnapshot: String): BudgetApprovedSeries!
  budgetApprovedRecords(input: BudgetApprovedRecordsInput!, first: Int = 50, after: String, expectedSnapshot: String): BudgetApprovedRecordConnection!
  budgetExecutionReleases(input: BudgetExecutionReleasesInput!, expectedSnapshot: String): BudgetExecutionReleaseIndex!
  budgetExecutionObservations(input: BudgetExecutionObservationsInput!, first: Int = 50, after: String, expectedSnapshot: String): BudgetExecutionObservationConnection!
  budgetNationalExecutionSeries(input: BudgetNationalExecutionSeriesInput!, expectedSnapshot: String): BudgetNationalSeriesResult!
}
