}

type BudgetExecutionReleaseIndex {
  snapshot: String!
  coverage: BudgetExecutionCoverage!
  months: [BudgetExecutionMonth!]!
}

type BudgetExecutionItem {
  itemId: ID!
  section: BudgetExecutionSection!
  sourceLabel: String!
  relatedScopeItemId: ID
  mappingVersion: String!
}

type BudgetExecutionObservation {
  id: ID!
  releaseId: ID!
  month: String!
  input: BudgetExecutionInput!
  observationKey: String!
  disposition: BudgetObservationDisposition!
  sourceState: String!
  catalogItem: BudgetExecutionItem
  section: BudgetExecutionSection
  lineItem: String
  component: String
  periodRole: BudgetExecutionPeriodRole
  measure: BudgetExecutionMeasure
  coverageKind: BudgetExecutionCoverageKind
  fiscalPeriod: BudgetDateInterval
  comparisonPeriod: BudgetDateInterval
  reportPeriod: BudgetDateInterval
  referenceYear: Int
  executionStatus: BudgetExecutionStatus
  finality: BudgetExecutionFinality
  value: String
  unit: BudgetValueUnit
  sourceToken: String
  reason: String
  locator: BudgetSourceLocator
  labelEvidence: BudgetCellEvidence
  document: BudgetSourceDocument!
}

type BudgetExecutionObservationEdge {
  cursor: String!
  occurrenceId: ID!
  selectionId: ID!
