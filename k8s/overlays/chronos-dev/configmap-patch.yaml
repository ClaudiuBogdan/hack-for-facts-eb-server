apiVersion: v1
kind: ConfigMap
metadata:
  name: hack-for-facts-eb-server-config
  namespace: hack-for-facts
data:
  PORT: '3000'
  HOST: 0.0.0.0
  LOG_LEVEL: info
  NOTIFICATION_DELIVERY_ENABLED: 'true'
  API_BASE_URL: https://dev-chronos-api.transparenta.eu
  # Enable only with the reviewed RNONG production snapshot and public-field audit.
  NGO_REGISTRY_ENABLED: 'true'
  # Set 'true' only after the public-enterprise read views are applied on Chronos
  # and the public-enterprise load is qualified (a root release operation).
  PUBLIC_ENTERPRISES_ENABLED: 'true'
  # Source-edition and contest metadata only; results and winners stay unavailable.
  ELECTIONS_ENABLED: 'true'
  PROD_ALLOWED_ORIGINS: https://dev-chronos.transparenta.eu
  PROD_CLIENT_BASE_URL: https://dev-chronos.transparenta.eu
  PROD_DB_POOL_MAX: '10'
  PROD_MEILI_HOST: http://transparenta-eu-etl-meilisearch.transparenta-eu-etl-prod.svc.cluster.local:7700
  PROD_MEILI_INDEXES: entities
  # Activate only after the prefix generation and API compatibility checks pass.
  PROD_SEARCH_POLICY: prefix-all
  PROD_OPENSEARCH_URL: https://transparenta-eu-etl-opensearch.transparenta-eu-etl-prod.svc.cluster.local:9200
  PROD_OPENSEARCH_CA_FILE: /var/run/secrets/chronos-opensearch/ca.pem
  # Legislation on legal_v2 (owner, 2026-11-20): Chronos dev only; the public site
  # stays on the legacy source. Word search uses the legal-v2 test indexes through
  # the shared reader above (role legal_v2_test_read).
  LEGAL_SOURCE: v2
  LEGAL_SEARCH_OPENSEARCH_ACTS_INDEX: legal-v2-test-acts-20261118
  LEGAL_SEARCH_OPENSEARCH_SECTIONS_INDEX: legal-v2-test-units-20261118
  PROD_OPENSEARCH_TLS_SERVERNAME: transparenta-eu-etl-opensearch.transparenta-eu-etl-prod.svc.cluster.local
  PROD_CLICKHOUSE_URL: https://transparenta-eu-etl-clickhouse.transparenta-eu-etl-prod.svc.cluster.local:8443
  PROD_CLICKHOUSE_DATABASE: proto
  # Procurement totals v2 (procurementTotals, MCP aggregate_procurement_totals) over the
  # active money build (procurement_v3.money_generations; build 1 activated 2026-11-22).
  # Chronos dev only.
  PROCUREMENT_TOTALS_V2: 'true'
  # DA release 1 (procurement_v3) on Chronos dev only (owner, 22 Nov); the server boots v3 only
  # with site-wide D6 enforced (root's rollout order), so both are on here. Public stays off
  # until the PRJ-54YB cutover and the client's DA-009 displayName switch.
  PROCUREMENT_SUPPLIER_DISCLOSURE_ENFORCED: 'true'
  PROCUREMENT_DA_V3_ENABLED: 'true'
  # The legacy DA list (procurementDirectAcquisitions, MCP search_procurement_direct_acquisitions)
  # names masked buyers from the raw authority name; retired on Chronos dev (owner, 23 Nov).
  PROCUREMENT_LEGACY_DA_LIST_ENABLED: 'false'
  # Every legacy procurement read (records, details, supplier records, legacy analysis grains,
  # presence) off on Chronos dev (owner, 24 Nov): interim containment while legacy contract
  # party names are not screened for personal codes. Back on only on root's word.
  PROCUREMENT_LEGACY_ENABLED: 'false'
  # Contract awards (PROC-KB0Z: buyer and winner-code lists, detail, 5 MCP tools) over the
  # procurement_v3 contract-award views, on Chronos dev only (user, 25 Nov). Needs D6 enforced.
  PROCUREMENT_CA_RECORDS_ENABLED: 'true'
  # The analysis API's contract grain (stats and series) from the ClickHouse money build, the
  # facts procurementTotals sums (PROC-KB0Z slice a; root, 28 Nov). Needs D6 enforced.
  PROCUREMENT_CA_ANALYSIS_ENABLED: 'true'
  # Companies analytics: same ClickHouse service, its own database and its own
  # read-only companies_reader user (credentials from the workload patch).
  COMPANIES_ANALYTICS_CLICKHOUSE_URL: https://transparenta-eu-etl-clickhouse.transparenta-eu-etl-prod.svc.cluster.local:8443
  COMPANIES_ANALYTICS_CLICKHOUSE_DATABASE: companies_analytics
  # Keys the kernel entrypoint never reads (review X/F16): the shared base
  # ConfigMap carries them for the legacy api.js; the redesign config schema
  # strips them silently, so they are removed here to keep the pod env honest.
  APP_NAME: null
  APP_PORT: null
  FLUSH_INTERVAL: null
  K8S_CLUSTER_NAME: null
  LOG_BATCH_SIZE: null
  RATE_LIMIT_MAX: null
  RATE_LIMIT_WINDOW: null
  SPECIAL_RATE_LIMIT_HEADER: null
  SPECIAL_RATE_LIMIT_MAX: null
