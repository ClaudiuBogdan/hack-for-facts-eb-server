apiVersion: apps/v1
kind: Deployment
metadata:
  name: hack-for-facts-eb-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      annotations:
        image-sha: 4bbd1f028177eeea2b67fa6485503d11cf8714ae
    spec:
      serviceAccountName: hack-for-facts-eb-server
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: dedicated
          operator: Equal
          value: compute
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: hack-for-facts-eb-server
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: hack-for-facts-eb-server
              topologyKey: kubernetes.io/hostname
      containers:
        - name: hack-for-facts-eb-server
          args:
            - dist/redesign-api.js
          env:
            - name: USER_DATA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: transparenta-eu-dev-user-db-app
                  key: uri
            - name: USER_DATA_DB_CA_FILE
              value: /var/run/secrets/chronos-dev-user-db/ca.crt
            - name: BULLMQ_REDIS_PASSWORD
              $patch: delete
            - name: PROD_MEILI_SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chronos-prod-meilisearch-search-credentials
                  key: apiKey
            - name: PROD_OPENSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: chronos-prod-opensearch-reader-credentials
                  key: username
            - name: PROD_OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chronos-prod-opensearch-reader-credentials
                  key: password
          volumeMounts:
            - name: chronos-dev-user-db-ca
              mountPath: /var/run/secrets/chronos-dev-user-db
              readOnly: true
          # Startup/liveness use the dependency-free /api/v1/live: /api/v1/health
          # bounds each dependency at 4 s and the user DB at 3 s, longer than the
          # base 3 s probe timeout, so a hung aux dependency would restart a
          # healthy pod. Readiness still runs the full dependency check, so its
          # timeout covers that bound.
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 3000
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /api/v1/live
              port: 3000
          livenessProbe:
            httpGet:
              path: /api/v1/live
              port: 3000
          lifecycle:
            $patch: delete
      volumes:
        - name: chronos-dev-user-db-ca
          secret:
            secretName: transparenta-eu-dev-user-db-ca
            items:
              - key: ca.crt
                path: ca.crt
