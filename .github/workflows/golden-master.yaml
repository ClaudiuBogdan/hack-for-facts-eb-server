name: Golden Master Tests

on:
  # Nightly schedule at 3:00 AM UTC
  schedule:
    - cron: '0 3 * * *'

  # Triggered after Dev Branch Pipeline completes (waits for build & push)
  workflow_run:
    workflows: ['Dev Branch Pipeline']
    types:
      - completed
    branches:
      - dev

  # Manual trigger with environment selection
  workflow_dispatch:
    inputs:
      skip_delay:
        description: 'Skip ArgoCD deployment delay'
        required: false
        default: false
        type: boolean
      run_security:
        description: 'Run report-only nightly security checks'
        required: false
        default: false
        type: boolean

# Don't cancel in-progress runs for scheduled jobs
concurrency:
  group: golden-master-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

env:
  # Default API URLs (can be overridden via GitHub secrets)
  # Phoenix dev (k8s/overlays/dev) is the LAST deployment that serves the legacy
  # /graphql — today the pre-slice-1 base image, to be pinned at `phoenix-last-full`
  # (X/F3 handover) — and is the cutover BASELINE only.
  DEV_API_URL: ${{ secrets.GM_DEV_API_URL || 'https://api-dev.transparenta.eu/graphql' }}
  # The deployment the Dev Branch Pipeline actually updates (k8s/overlays/chronos-dev).
  CHRONOS_DEV_API_URL: ${{ secrets.GM_CHRONOS_DEV_API_URL || 'https://dev-chronos-api.transparenta.eu/api/v1/graphql' }}
  # No production job: nothing left in the suite may run against production
  # (the kernel replay spec refuses it; the legacy snapshot specs were deleted
  # in slice 1 commit 6, 2026-09-09).
  # Time to wait for ArgoCD to deploy after workflow completes (in seconds)
  ARGOCD_DEPLOY_DELAY: 180

jobs:
  # No snapshot job: the legacy snapshot specs were deleted in slice 1 commit 6
  # (2026-09-09) and the surviving kernel replay spec
  # (legacy-execution-analytics-kernel) is a LOCAL diagnostic until its
  # execution-analytics snapshots are re-baselined for the documented 13 §7
  # deltas; the cutover replay below is the gate.
  cutover-replay-chronos-dev:
    name: Cutover replay (Phoenix dev -> Chronos dev)
    runs-on: ubuntu-latest
    # The Dev Branch Pipeline pins and deploys the CHRONOS dev overlay, which
    # serves no legacy /graphql for the snapshot suite; its post-deploy check is
    # the client-corpus replay: every document the pinned client sends, Phoenix
    # dev as baseline, Chronos dev as target, parity-allowlist as the contract.
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    steps:
      # Scheduled and workflow_run runs execute this workflow file from the
      # DEFAULT branch; the corpus, allowlist and harness must come from the
      # branch the dev environment is built from.
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Wait for ArgoCD deployment
        if: github.event_name == 'workflow_run'
        run: |
          echo "Waiting $ARGOCD_DEPLOY_DELAY seconds for ArgoCD to deploy the new version..."
          sleep $ARGOCD_DEPLOY_DELAY
          echo "Delay complete, proceeding with the replay"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Replay the client corpus (baseline Phoenix dev, target Chronos dev)
        env:
          TEST_GM_BASELINE_URL: ${{ env.DEV_API_URL }}
          TEST_GM_API_URL: ${{ env.CHRONOS_DEV_API_URL }}
          TEST_GM_REPORT_DIR: cutover-report
        run: |
          echo "Baseline: $TEST_GM_BASELINE_URL"
          echo "Target:   $TEST_GM_API_URL"
          pnpm test:gm:cutover 2>&1 | tee cutover-output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutover-replay-chronos-dev-${{ github.run_id }}
          path: |
            cutover-output.txt
            cutover-report
          retention-days: 14

  security-nightly:
    name: Nightly Security Checks
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_security == true)
    outputs:
      status: ${{ steps.security-status.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run report-only security scans
        id: security-scans
        run: |
          mkdir -p security-results "${{ github.workspace }}/.trivycache"

          set +e

          pnpm audit --audit-level high > security-results/pnpm-audit.txt 2>&1
          audit_exit=$?

          docker run --rm \
            -v "${{ github.workspace }}:/workdir" \
            -w /workdir \
            -v "${{ github.workspace }}/.trivycache:/root/.cache/" \
            aquasec/trivy:0.69.1 config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            Dockerfile .github/workflows k8s > security-results/trivy-config.txt 2>&1
          trivy_exit=$?

          set -e

          {
            echo "audit_exit_code=$audit_exit"
            echo "trivy_exit_code=$trivy_exit"
          } | tee security-results/scan-metadata.txt >> "$GITHUB_OUTPUT"

      - name: Summarize security findings
        if: always()
        id: security-status
        run: |
          status="passed"
          if [ "${{ steps.security-scans.outputs.audit_exit_code }}" != "0" ] || [ "${{ steps.security-scans.outputs.trivy_exit_code }}" != "0" ]; then
            status="warnings"
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"

          echo "## Nightly Security Checks" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.security-scans.outputs.audit_exit_code }}" = "0" ]; then
            echo "- ✅ pnpm audit: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ⚠️ pnpm audit: Warnings" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.security-scans.outputs.trivy_exit_code }}" = "0" ]; then
            echo "- ✅ Trivy config scan: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ⚠️ Trivy config scan: Warnings" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts: security-nightly-results-${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-nightly-results-${{ github.run_id }}
          path: security-results
          retention-days: 7

  # Summary job to report overall status
  summary:
    name: Golden Master Summary
    runs-on: ubuntu-latest
    needs: [cutover-replay-chronos-dev, security-nightly]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Golden Master Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.cutover-replay-chronos-dev.result }}" == "success" ]; then
            echo "- ✅ Cutover replay (Phoenix dev → Chronos dev): Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.cutover-replay-chronos-dev.result }}" == "failure" ]; then
            echo "- ❌ Cutover replay (Phoenix dev → Chronos dev): Failed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.cutover-replay-chronos-dev.result }}" == "skipped" ]; then
            echo "- ⏭️ Cutover replay (Phoenix dev → Chronos dev): Skipped" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.security-nightly.result }}" == "skipped" ]; then
            echo "- ⏭️ Security checks: Skipped" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.security-nightly.outputs.status }}" == "passed" ]; then
            echo "- ✅ Security checks: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.security-nightly.outputs.status }}" == "warnings" ]; then
            echo "- ⚠️ Security checks: Warnings" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Security checks: Failed to run" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: the cutover replay is a blocking contract check (a failed run is a failed workflow); the nightly security scans are report-only. Neither blocks a deployment that already happened." >> $GITHUB_STEP_SUMMARY
